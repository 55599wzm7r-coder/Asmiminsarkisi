<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffe7ef">
<title>Sana küçük bir sürprizim var ❤️</title>
<style>
:root{--pink:#f6a9c2;--deep:#b94770;--ink:#633348;--cream:#fff9fb}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;
font-family:Georgia,"Times New Roman",serif;color:var(--ink);
background:radial-gradient(circle at 15% 15%,#fff 0 2px,transparent 3px),
linear-gradient(145deg,#fff7fa,#ffe2ec 55%,#f9c7d8)}
.card{width:min(100%,440px);padding:34px 26px 30px;text-align:center;
background:rgba(255,255,255,.82);border:1px solid #fff;border-radius:28px;
box-shadow:0 18px 55px rgba(157,62,99,.16);position:relative;overflow:hidden}
.heart{font-size:34px;letter-spacing:8px;color:#e77fa2}
h1{font-size:29px;line-height:1.15;margin:14px 0 10px}
.sub{font:15px/1.55 Arial,sans-serif;color:#946477;margin:0 auto 24px;max-width:300px}
input{width:100%;padding:16px;border:1.5px solid #f0b5c9;border-radius:14px;
background:#fffafd;text-align:center;font-size:19px;letter-spacing:4px;color:var(--ink);outline:none}
input:focus{border-color:var(--deep);box-shadow:0 0 0 3px #fbe0e9}
button{width:100%;border:0;border-radius:14px;padding:15px;margin-top:13px;
background:linear-gradient(135deg,#d65f89,#b94770);color:white;font-weight:bold;
font-size:16px;cursor:pointer;box-shadow:0 8px 18px #d65f8938}
button:active{transform:scale(.99)}
#message{min-height:22px;margin-top:12px;font:14px Arial,sans-serif;color:#b94770}
#reveal{display:none;margin-top:20px;animation:pop .6s ease}
.cover{width:116px;height:116px;border-radius:22px;margin:0 auto 14px;
display:grid;place-items:center;background:linear-gradient(135deg,#f9c4d6,#fce9ef);
font-size:48px;box-shadow:0 8px 20px #b9477022}
.songtitle{font-size:21px;margin:6px 0;color:#853d5b}
.note{font:14px/1.5 Arial,sans-serif;color:#946477}
audio{width:100%;margin-top:15px}
.small{font:11px Arial,sans-serif;color:#b88b9d;margin-top:24px}
.sparkle{position:absolute;opacity:.24;font-size:22px}
.s1{top:16px;left:18px}.s2{right:18px;top:35px}.s3{bottom:20px;right:25px}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<main class="card">
  <span class="sparkle s1">✦</span><span class="sparkle s2">♡</span><span class="sparkle s3">✧</span>
  <div class="heart">♡ ♡ ♡</div>
  <h1>Sana küçük bir<br>sürprizim var</h1>
  <p class="sub">Kazı-kazandan çıkan gizli kodu buraya yaz.</p>
  <form id="unlockForm">
    <input id="code" type="password" inputmode="numeric" autocomplete="off"
      placeholder="GİZLİ KOD" aria-label="Gizli kod" maxlength="24" required>
    <button type="submit">Sürprizimi aç ❤️</button>
    <div id="message" role="status"></div>
  </form>
  <section id="reveal">
    <div class="cover">💗</div>
    <div class="songtitle">Bu sarkı senin en sevdiğin şarkı değil miydi?😍</div>
    <p class="note">Bende buna özel bir site yapmak istedim.<br>Beğenmen dileğiyle❤️...</p>
    <audio id="player" controls preload="none">
      <source src="God%20Knows%20I%20Tried.mp3" type="audio/mpeg">
      Tarayıcın ses oynatmayı desteklemiyor.
    </audio>
  </section>
</main>
<script>
const SECRET_CODE = "01052025";
const form = document.getElementById("unlockForm");
const field = document.getElementById("code");
const msg = document.getElementById("message");
const reveal = document.getElementById("reveal");
const player = document.getElementById("player");
form.addEventListener("submit", function(e){
  e.preventDefault();
  if(field.value.trim() !== SECRET_CODE){
    msg.textContent = "Bu kod olmadı. Bir kez daha dene 💌";
    field.select();
    return;
  }
  msg.textContent = "";
  form.style.display = "none";
  reveal.style.display = "block";
  player.play().catch(()=> {
    msg.textContent = "Şarkıyı başlatmak için oynat düğmesine dokun ❤️";
  });
});
</script>
</body>
</html>
